services:
  streamgo:
    container_name: streamgo
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./stream_media:/app/stream_media
      - ./cookies:/app/cookies
      # Optional: uncomment to mount host dist for live frontend development without image rebuild
      # - ./dist:/app/dist:ro
    restart: unless-stopped
